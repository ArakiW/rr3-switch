backend=mesa
nofb=1
ccdisp=2
objid=1
mkdiridem=0
ccloginok=1
ccsocialok=1
# nogo=1 -- ON since 2026-10-29: never bring the socket stack up, so every outbound connection fails
# at once instead of hanging.
#
# This is the knob the whole investigation started on, and the 2026-10-12 run
# that exercised it was inconclusive (cloudcell_defer=0, so the login path
# could not run). It is worth another try now that login and the social-media
# session both answer.
#
# The reason it should matter now: the guest's main thread is parked in
# libnx send() (host+0x54f2e8 -> socket.c:594) waiting for a response that
# never comes. That is the hang, not the Cloudcell state machine. With no
# socket stack there is nothing to block on, and the guest can take its own
# offline path.
#
# Caveat: a send() that never returns is also what a WRONG nogo looked like
# (frames 4200 in the 2026-10-12 run). If this run also drops to a few
# hundred frames, nogo is not the answer and the block is elsewhere.
nogo=1
ccmode=bg
# ---------------------------------------------------------------------------
# ACTIVE KEYS ARE AT THE TOP, ON PURPOSE.
#
# rr3-gfx.conf is read once into a 4096-byte buffer. This file reached 4549
# bytes on 2026-10-19 and everything past the limit was dropped in silence
# (conf_trunc=1), which is how two runs once measured the same configuration
# twice. Keep this file short: notes belong in git, not on the SD card.
#
# backend=mesa  DO NOT switch back to null -- null only counts GL calls and
#               never forwards them, so nothing reaches a GPU.
# nofb=1        DO NOT remove. Mesa never gets past eglInitialize without it:
#               nativeUiInit()'s framebufferCreate on the default NWindow,
#               closed again by nativeUiExit(), poisons that NWindow for the
#               rest of the process.
# ccsynth       absent, i.e. 0: the host does NOT install its synthetic
#               Cloudcell object and the guest builds its own. Letting the
#               guest's own constructor (0x1cbe03c) stand removes an entire
#               class of bug; four successive host substitutions each cost a
#               5-minute run and all four were wrong.
# menugate      GONE on purpose. It only ever wrote into that synthetic object.
# ccmode        GONE for the same reason. Re-add either only with ccsynth=1.
# glctxearly    default on. gpuid default powervr (the guest's table maps
#               PowerVR to id 4, which is what 0x12af190 compares against).
# ---------------------------------------------------------------------------
#
# ccdisp=1 (2026-10-19) -- LOG-ONLY, deliberately.
#
# 1 resolves each Cloudcell void call against the ManagedMethod table and logs
# the verdict without calling. With it, login / setUserIdentifier /
# Constructor on AndroidAccountManager, FacebookWorker and GooglePlayWorker
# all resolve (archive 20261019-114127-ccdisp6).
#
# ccdisp=2 was tried on 2026-10-19 and is A REGRESSION, not a tuning knob.
# Archive 20261019-115624-ccdisp7: frames 16320 -> 15, the guest main thread
# stuck inside jni:CallObjectMethod with enters=1641 exited=0, and Sub Sync
# Queued went from 13 to 10790. "Invalid DeviceId!" did drop to zero, but the
# guest died, so that is not a result. Do not turn this back on until the
# CallObjectMethod path is understood -- that slot is not wired to dispatch at
# all yet, and the stall is on it.
#
# objid=1 (2026-10-19) -- one real handle per NewObjectV instead of the single
# shared &g_fakeObjectObject. Two defects came from that sentinel: instance
# methods arrived with no class at all, and any facade writing instance fields
# wrote into one byte of globals (aam_constructor alone stores 16). This is the
# interlock that makes ccdisp=2 memory-safe at all, so it stays on even while
# ccdisp=2 is off.
#
# objid=1 A/B (archive 20261019-115024-objid1): frames=16320, identical to
# objid=0, pool not overflowed. The address change is inert.
# ---------------------------------------------------------------------------
