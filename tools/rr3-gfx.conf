backend=mesa
nofb=1
iconfont=1
ccdisp=2
objid=1
mkdiridem=0
ccloginok=1
ccsocialok=1
nogo=0
ccmode=bg
swdxt=0
# ---------------------------------------------------------------------------
# ACTIVE KEYS ARE AT THE TOP, ON PURPOSE.
#
# rr3-gfx.conf is read once into a 4096-byte buffer.  This file reached 4549
# bytes on 2026-10-19 and everything past the limit was dropped in silence
# (conf_trunc=1), which is how two runs once measured the same configuration
# twice.  Keep this file short: notes belong in git, not on the SD card.
#
# backend=mesa  DO NOT switch back to null -- null only counts GL calls and
#               never forwards them, so nothing reaches a GPU.
# nofb=1        DO NOT remove. Mesa never gets past eglInitialize without it:
#               nativeUiInit()'s framebufferCreate on the default NWindow,
#               closed again by nativeUiExit(), poisons that NWindow for the
#               rest of the process.
# swdxt=0       The port CAN decode DXT1/DXT5 itself and upload plain RGBA,
#               which is what takes Mesa out of the S3TC decode that zeroes
#               the green channel of the rival cars (the magenta).  IT IS OFF
#               BY DEFAULT, because the port cannot yet tell WHICH upload
#               belongs to which file it served: the guest mmaps the GUI
#               atlases at startup and uploads them hundreds of frames later,
#               so "the texture I served most recently" is the wrong answer
#               and decoding a PVR atlas as DXT turns the event card into
#               rainbow noise (measured, docs/OPEN-ISSUES.md 9.19).
#               The safe version of this fix re-encodes the texture AT SERVE
#               TIME -- so the DDS the guest reads already says RGBA -- and
#               that is the next piece of work, not this switch.
# iconfont=1    The game's ICON font (r3_symbols.ttf) is opened as itself.
#               The guest asks for it eighteen times per run and every one of
#               those draws is a ONE-CHARACTER icon (a trophy, a stack of
#               cash, the game's logo).  With 0 the icons are drawn with a
#               text face instead -- which is what the port used to do, so
#               every icon came out as a Latin letter (U+00CB as a K with an
#               accent, U+0111 as a d with a stroke) and 2.3x..5.8x too small.
#               Set 0 to put the old behaviour back without a new build.
# ccdisp=2      A REGRESSION in the Cloudcell dispatch (2026-10-19): the guest
#               main thread stuck in jni:CallObjectMethod and "Sub Sync
#               Queued" went 13 -> 10790.  objid=1 is the interlock that makes
#               it memory-safe, so it stays on even while ccdisp=2 is off.
# menugate      GONE on purpose. It only ever wrote into a synthetic object.
# ccmode        GONE for the same reason. Re-add either only with ccsynth=1.
# glctxearly    default OFF (the host answers glGetString without a context;
#               see README-hardware-test.md section 0.2).
# gpuid         default powervr (the guest's table maps PowerVR to id 4, which
#               is what 0x12af190 compares against).
# nogo=0        Leave it off unless the guest hangs in libnx send(): a
#               send() that never returns is also what a WRONG nogo looked
#               like (frames 4200 in the 2026-10-12 run).
# ---------------------------------------------------------------------------
